<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Zpěvník – písně jako statické stránky." />
    <title>Zpěvník</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">🎵 <span>Zpěvník</span></a>
      <nav class="nav">
        <a href="/">Domů</a>
      </nav>
      <div class="search">
        <input
          id="search"
          type="search"
          placeholder="Vyhledat píseň…"
          autocomplete="off"
          aria-label="Vyhledat píseň"
        />
        <div id="suggest" class="suggest" role="listbox" hidden></div>

    <main id="app" aria-live="polite"></main>
    <footer class="foot muted">Statické stránky generované z <a href="https://github.com/zbycz/zpevnik" target="_blank" rel="noopener">GitHubu</a>.</footer>
